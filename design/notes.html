<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ecebe6">
<title>DemoBench · Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --room:#ecebe6; --ink:#1c1c1e; --mid:#6d6b65; --line:#d3d0c8; --code:#e2e0d9;
  --accent:#ff5a36;
  --display:'Unbounded',system-ui,sans-serif; --ui:'Figtree',system-ui,sans-serif; --mono:'Red Hat Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--room:#151619;--ink:#efeee9;--mid:#9a9891;--line:#2c2d31;--code:#222327;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--room);color:var(--ink);font-family:var(--ui);min-height:100vh}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.top{display:flex;align-items:stretch;justify-content:space-between;border-bottom:1px solid var(--ink);height:52px}
.logo{display:flex;align-items:center;padding:0 24px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.02em;text-decoration:none}
.logo span{color:var(--accent)}
.top nav{display:flex}
.top nav a{display:flex;align-items:center;padding:0 20px;border-left:1px solid var(--line);text-decoration:none;font-weight:600;font-size:14px;color:var(--mid)}
.top nav a:hover{color:var(--ink)}

.wrap{max-width:820px;margin:0 auto;padding:28px 24px 90px}
.back{font-weight:600;font-size:14px;color:var(--mid);text-decoration:none}.back:hover{color:var(--ink)}
.cat{margin-top:34px;font-family:var(--mono);font-size:12px;color:var(--mid)}.cat b{color:var(--accent);font-weight:500}
h1{margin:10px 0 0;font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,52px);line-height:1;letter-spacing:-.035em}
.sub{margin:6px 0 0;color:var(--mid);font-weight:500;font-size:17px}
.lede{font-size:18px;line-height:1.5}
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px;margin:26px 0 0;padding:0}
.scenes figure{margin:0}
.scenes img{display:block;width:100%;aspect-ratio:4/3;image-rendering:pixelated;background:#000}
.scenes figcaption{margin-top:5px;font-size:12.5px;line-height:1.3;color:var(--mid)}
.scenes figcaption b{display:block;font-family:var(--mono);font-weight:500;font-size:11px}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:0;margin:22px 0 8px}
.btn{display:inline-flex;align-items:center;padding:14px 22px;font-weight:700;font-size:14px;text-decoration:none;background:var(--ink);color:var(--room);border:1px solid var(--ink)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none;color:var(--ink);border-left:0}.btn.ghost:hover{background:var(--ink);border-color:var(--ink);color:var(--room)}

.md{font-size:16.5px;line-height:1.6}
.md h2{margin:52px 0 0;padding-top:12px;border-top:1px solid var(--ink);font-family:var(--display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em}
.md h3{margin:30px 0 0;font-size:18px;font-weight:700}
.md p,.md ul,.md pre,.md .table{margin:12px 0 0}
.md ul{padding-left:22px}.md li+li{margin-top:5px}.md li>ul{margin-top:5px}
.md li::marker{color:var(--mid)}
.md code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 4px;overflow-wrap:anywhere}
.md pre{overflow-x:auto;background:var(--code);padding:12px 14px}.md pre code{padding:0;background:none}
.md .table{overflow-x:auto}
.md table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.45}
.md th{text-align:left;font-size:12px;font-weight:600;color:var(--mid);border-bottom:1px solid var(--ink);padding:6px 12px 6px 0}
.md td{vertical-align:top;border-bottom:1px solid var(--line);padding:8px 12px 8px 0}
.md td:first-child{font-family:var(--mono);font-size:13px}.md .short{white-space:nowrap}
.md th.num,.md td.num{text-align:right}
.md .timeline table{min-width:620px}
.missing{margin-top:40px;color:var(--mid)}

@media (max-width:760px){
  .logo{padding:0 16px}.top nav a{padding:0 14px}.wrap{padding:22px 16px 80px}
  .scenes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .md{font-size:16px}
}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="console.html">Demo<span>/</span>Bench</a>
  <nav><a href="console.html">Cartridges</a><a href="studio.html">Studio</a></nav>
</header>

<main class="wrap">
  <a class="back" href="console.html">← All cartridges</a>
  <article id="notes"></article>
</main>

<script src="previews/data.js"></script>
<script>
// Renders a cartridge author's notes (design/previews/notes/<id>.md) beside its captured scene keyframes.
// The notes are the author's README, minus the local file table and build instructions; the renderer covers
// the Markdown those use: headings, paragraphs, nested lists, tables, fenced code, code spans, bold and italics.
const SHELF = 'console.html';
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const inline = s => s.split(/(`[^`]+`)/).map((part, i) => i % 2 ? `<code>${esc(part.slice(1, -1))}</code>`
  : esc(part).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^\w*])\*(?=\S)([^*]+?)\*(?!\w)/g, '$1<em>$2</em>')).join('');
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

function list(lines) {
  const items = [];
  for (const line of lines) {
    const m = line.match(/^(\s*)[-*] (.*)/);
    if (m) items.push({ depth: m[1].length, text: m[2] });
    else items.at(-1).text += ' ' + line.trim();
  }
  let html = '';
  const stack = [];
  for (const it of items) {
    while (stack.length && it.depth < stack.at(-1)) { html += '</li></ul>'; stack.pop(); }
    if (!stack.length || it.depth > stack.at(-1)) { html += '<ul>'; stack.push(it.depth); } else html += '</li>';
    html += `<li>${inline(it.text)}`;
  }
  return html + '</li></ul>'.repeat(stack.length);
}
function table(lines, heading) {
  const rows = lines.filter(l => !/^\|[\s:|-]+\|$/.test(l)).map(l => l.replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
  const [head, ...body] = rows;
  // numeric columns align right; short columns (times, bar ranges) stay on one line
  const num = head.map((_, c) => body.length && body.every(r => /^[\d,.]+$/.test(r[c] ?? '')));
  const short = head.map((_, c) => body.every(r => (r[c] ?? '').length <= 8));
  const cls = head.map((_, c) => [num[c] && 'num', short[c] && 'short'].filter(Boolean).join(' '));
  const cell = (tag, text, c) => `<${tag}${cls[c] ? ` class="${cls[c]}"` : ''}>${inline(text)}</${tag}>`;
  return `<div class="table${/^Timeline/.test(heading) ? ' timeline' : ''}"><table><thead><tr>${head.map((h, c) => cell('th', h, c)).join('')}</tr></thead>`
    + `<tbody>${body.map(r => `<tr>${r.map((t, c) => cell('td', t, c)).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function markdown(md) {
  const lines = md.split('\n');
  let html = '', heading = '', m;
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    if ((m = line.match(/^(#{2,4}) (.*)/))) {
      heading = m[2];
      html += `<h${m[1].length} id="${slug(m[2])}">${inline(m[2])}</h${m[1].length}>`; i++;
    } else if (line.startsWith('```')) {
      const body = [];
      for (i++; i < lines.length && !lines[i].startsWith('```'); i++) body.push(lines[i]);
      i++; html += `<pre><code>${esc(body.join('\n'))}</code></pre>`;
    } else if (line.startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++].trim());
      html += table(rows, heading);
    } else if (/^\s*[-*] /.test(line)) {
      const rows = [];
      while (i < lines.length && lines[i].trim() && (/^\s*[-*] /.test(lines[i]) || /^\s/.test(lines[i]))) rows.push(lines[i++]);
      html += list(rows);
    } else {
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(#|```|\||\s*[-*] )/.test(lines[i])) para.push(lines[i++].trim());
      html += `<p>${inline(para.join(' '))}</p>`;
    }
  }
  return html;
}

async function show() {
  const id = new URLSearchParams(location.search).get('demo');
  const d = (window.DEMOS ?? []).find(x => x.id === id && x.readme);
  const root = $('#notes');
  if (!d) { root.innerHTML = '<p class="missing">There are no notes for this cartridge.</p>'; return; }
  document.title = `DemoBench · ${d.title} notes`;
  let md;
  try {
    const r = await fetch(`previews/${d.readme}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    md = await r.text();
  } catch (error) { root.innerHTML = `<p class="missing">Could not load the notes (${esc(error.message)}).</p>`; return; }
  // the README's title and opening paragraph lead the page; the rest follows the scene strip
  const [, heading = d.title, rest = md] = md.match(/^# (.*)\n+([\s\S]*)$/) ?? [];
  const [title, sub = ''] = heading.split(/\s+—\s+/);
  const [, lede = '', body = rest] = rest.match(/^((?:(?!#|\|)[^\n]+\n?)+)\n*([\s\S]*)$/) ?? [];
  root.innerHTML = `<div class="cat">${d.author ? `<b>by ${esc(d.author)}</b> · ` : ''}${fmt(d.payloadBytes)} of 4,096 bytes · ${esc(d.profile)} · ${d.engines.join('+')}</div>
    <h1>${inline(title)}</h1>${sub ? `<p class="sub">${inline(sub)}</p>` : ''}
    <div class="md lede"><p>${inline(lede.split('\n').map(l => l.trim()).join(' ').trim())}</p></div>
    ${d.scenes ? `<div class="scenes">${d.scenes.map((s, i) => `<figure><img src="previews/${d.keyframes[i].file}" alt="${esc(s.name)}" width="160" height="120" loading="lazy">
      <figcaption><b>${s.at} s</b>${esc(s.name)}</figcaption></figure>`).join('')}</div>` : ''}
    <div class="actions"><a class="btn" href="${SHELF}?demo=${encodeURIComponent(d.id)}">Run the cartridge →</a><a class="btn ghost" href="studio.html?demo=${encodeURIComponent(d.id)}">Open in Studio</a></div>
    <div class="md">${markdown(body)}</div>`;
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
}
show();
</script>
<script src="switcher.js"></script>
</body>
</html>
