<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>DemoBench · Byte Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Azeret+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#111110; --mid:#77766f; --hair:#dcdbd5; --cell:#efeee9; --accent:#ff3d00;
  --sans:'Archivo',system-ui,sans-serif; --mono:'Azeret Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#0e0e0d;--ink:#f1f0ea;--mid:#8f8e87;--hair:#2c2c29;--cell:#1b1b19;--accent:#ff5a26;color-scheme:dark}}
:root[data-theme=dark]{--paper:#0e0e0d;--ink:#f1f0ea;--mid:#8f8e87;--hair:#2c2c29;--cell:#1b1b19;--accent:#ff5a26;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-stretch:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:1360px;margin:0 auto;padding:28px 28px 90px}

header{display:grid;grid-template-columns:auto 1fr;gap:40px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:18px}
.mark{font-stretch:62%;font-weight:900;font-size:clamp(46px,7vw,96px);line-height:.82;letter-spacing:-.01em;text-transform:uppercase}
.mark span{color:var(--accent)}
.lede{font-stretch:88%;font-size:clamp(18px,2vw,24px);line-height:1.2;font-weight:500;max-width:620px;justify-self:end;text-align:right}
.lede b{font-weight:800}

/* size ruler */
.ruler{position:relative;margin:34px 0 8px;height:150px}
.axis{position:absolute;left:0;right:0;bottom:24px;height:2px;background:var(--ink)}
.tick{position:absolute;bottom:0;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--mid)}
.tick:before{content:"";position:absolute;left:50%;bottom:18px;width:1px;height:12px;background:var(--ink)}
.tick.limit{color:var(--accent);font-weight:500;white-space:nowrap;transform:translateX(-100%)}.tick.limit:before{left:100%}.tick.limit:before{background:var(--accent);height:130px;bottom:18px}
.pin{position:absolute;bottom:26px;width:0}
.pin i{position:absolute;bottom:0;left:-1px;width:2px;background:var(--ink)}
.pin a{position:absolute;left:4px;white-space:nowrap;font-size:13px;font-weight:700;font-stretch:75%;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);text-decoration:none}
.pin a small{font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:0;color:var(--mid);margin-left:5px}
.pin a:hover{color:var(--accent)}
.pin.flip a{left:auto;right:4px;text-align:right}
.pin.agent i,.pin.agent a{color:var(--accent);background-color:transparent}.pin.agent i{background:var(--accent)}

.bar{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin:26px 0 18px;flex-wrap:wrap}
.bar h2{margin:0;font-stretch:62%;font-weight:800;font-size:28px;text-transform:uppercase}
.sort{display:flex;gap:18px;font-family:var(--mono);font-size:12px}
.sort button[aria-pressed=true]{color:var(--accent);text-decoration:underline;text-underline-offset:4px}

/* plates */
.plates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:44px 32px}
.plate{border-top:2px solid var(--ink);padding-top:10px;cursor:pointer}
.plate:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.num{display:flex;align-items:baseline;gap:8px}
.num strong{font-stretch:62%;font-weight:900;font-size:76px;line-height:.9;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.num span{font-family:var(--mono);font-size:11px;color:var(--mid)}
.num em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px}
.plate.agent .num strong{color:var(--accent)}
.fill{height:4px;background:var(--cell);margin:8px 0 12px;position:relative}
.fill i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.plate.agent .fill i{background:var(--accent)}
.pair{display:grid;grid-template-columns:4fr 3fr;gap:10px}
.pair{align-items:start}
.pair img{display:block;width:100%;height:auto;image-rendering:pixelated}
.shot{aspect-ratio:4/3;background:#000}
.bytes{aspect-ratio:1;background-color:var(--cell);background-image:linear-gradient(var(--paper) 1px,transparent 1px),linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:12.5% 12.5%}
.plate h3{margin:12px 0 0;font-stretch:112%;font-weight:800;font-size:19px;letter-spacing:-.01em}
.plate h3 small{font-stretch:100%;font-weight:500;font-size:14px;color:var(--mid);margin-left:6px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--mid);margin-top:6px}
.meta b{color:var(--ink);font-weight:500}
.hex{font-family:var(--mono);font-size:10.5px;margin-top:8px;min-height:1.4em;color:var(--mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hex b{color:var(--accent);font-weight:500}
.plate.empty{cursor:default}
.plate.empty .num strong{color:var(--hair)}
.plate.empty .shot{background:var(--cell);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--mid)}

/* detail */
dialog{border:0;padding:0;background:var(--paper);color:var(--ink);width:min(1100px,94vw);max-height:92vh}
dialog::backdrop{background:#000b}
.sheet{padding:26px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.sheet .close{position:absolute;right:18px;top:14px;font-size:26px;line-height:1}
.sheet h2{margin:0;font-stretch:62%;font-weight:900;font-size:60px;line-height:.9;text-transform:uppercase}
.sheet .sub{color:var(--mid);margin:6px 0 16px}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-family:var(--mono);font-size:11.5px;margin:0}
.sheet dt{color:var(--mid)}.sheet dd{margin:0;overflow-wrap:anywhere}
.sheet p{line-height:1.45}
.dump{font-family:var(--mono);font-size:10.5px;line-height:1.55;white-space:pre;overflow:auto;background:var(--cell);padding:10px 12px;margin-top:14px;max-height:220px}
.sheet .pair{margin-top:0}
.sheet a{color:var(--accent);font-family:var(--mono);font-size:12px}

@media (max-width:1100px){.plates{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){
  .wrap{padding:18px 16px 80px}
  header{grid-template-columns:1fr;gap:12px}.lede{justify-self:start;text-align:left}
  .ruler{height:auto;margin-top:20px}
  .ruler .axis,.ruler .tick{display:none}
  .pin{position:static;width:auto;display:flex;align-items:center;gap:8px;margin:4px 0}
  .pin i{position:static;height:6px!important;width:calc(var(--w) * 1%);min-width:4px}
  .pin a{position:static}
  .plates{grid-template-columns:1fr}
  .sheet{grid-template-columns:1fr;padding:18px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Demo<span>/</span><br>Bench</div>
    <p class="lede">Agents write audiovisual demos for an unfamiliar machine. <b>Every byte below is the whole program</b>: code, tables, music and text, inside 4,096.</p>
  </header>

  <section class="ruler" id="ruler" aria-label="Payload size of every cartridge"></section>

  <div class="bar"><h2>Plates</h2>
    <div class="sort" role="group" aria-label="Sort plates">
      <button type="button" data-sort="desc" aria-pressed="true">largest first</button>
      <button type="button" data-sort="asc" aria-pressed="false">smallest first</button>
      <button type="button" data-sort="name" aria-pressed="false">a–z</button>
    </div>
  </div>
  <main class="plates" id="plates"></main>
</div>
<dialog id="detail" aria-label="Cartridge detail"></dialog>

<script src="previews/data.js"></script>
<script>
const $ = s => document.querySelector(s);
const fmt = n => n.toLocaleString('en-US');
const poster = d => `previews/${d.poster ?? d.keyframes[0].file}`;
const hexAt = (d, i) => d.payloadHex.slice(i * 2, i * 2 + 2);

/* ruler: every cartridge pinned at its payload size */
const ruler = $('#ruler');
ruler.innerHTML = '<div class="axis"></div>' + [0, 1024, 2048, 3072, 4096].map(b => `<span class="tick${b === 4096 ? ' limit' : ''}" style="left:${b / 4096 * 100}%">${b === 4096 ? '4,096 B limit' : fmt(b)}</span>`).join('');
[...DEMOS].sort((a, b) => a.payloadBytes - b.payloadBytes).forEach((d, i) => {
  const pin = document.createElement('div');
  pin.className = 'pin' + (d.author ? ' agent' : '') + (d.payloadBytes > 3000 ? ' flip' : '');
  pin.style.left = `${d.payloadBytes / 4096 * 100}%`;
  pin.style.setProperty('--w', d.payloadBytes / 4096 * 100);
  const h = 14 + (i % 4) * 24;
  pin.innerHTML = `<i style="height:${h + 12}px"></i><a href="#${d.id}" style="bottom:${h}px">${d.title}${/revision|rays/.test(d.subtitle) ? ` · ${d.subtitle}` : ''}<small>${fmt(d.payloadBytes)}</small></a>`;
  ruler.append(pin);
});

/* plates */
const plates = $('#plates');
function plate(d) {
  const el = document.createElement('article');
  el.className = 'plate' + (d.author ? ' agent' : '');
  el.id = d.id; el.tabIndex = 0;
  el.setAttribute('aria-label', `${d.title}, ${fmt(d.payloadBytes)} bytes. Open details.`);
  el.innerHTML = `<div class="num"><strong>${fmt(d.payloadBytes)}</strong><span>/ 4,096 B</span><em>${(d.payloadBytes / 40.96).toFixed(1)}%</em></div>
    <div class="fill"><i style="width:${d.payloadBytes / 40.96}%"></i></div>
    <div class="pair"><img class="shot" src="${poster(d)}" alt="${d.title} output" width="160" height="120">
      <img class="bytes" src="previews/${d.bytes}" alt="All ${fmt(d.payloadBytes)} payload bytes, one pixel each" width="64" height="64"></div>
    <h3>${d.title}<small>${d.subtitle}</small></h3>
    <div class="meta">${d.author ? `<span>by <b>${d.author}</b></span>` : ''}<span><b>${d.profile}</b></span><span>${d.engines.join('+')}</span><span>${d.format}</span><span>${d.lines} lines</span></div>
    <div class="hex" aria-hidden="true">hover the bytes to read them</div>`;
  const shot = el.querySelector('.shot'), bytes = el.querySelector('.bytes'), hex = el.querySelector('.hex');
  el.addEventListener('mouseenter', () => { shot.src = `previews/${d.gif}`; });
  el.addEventListener('mouseleave', () => { shot.src = poster(d); hex.textContent = 'hover the bytes to read them'; });
  bytes.addEventListener('mousemove', e => {
    const r = bytes.getBoundingClientRect();
    const i = Math.floor((e.clientY - r.top) / r.height * 64) * 64 + Math.floor((e.clientX - r.left) / r.width * 64);
    if (i >= d.payloadBytes) { hex.textContent = `0x${i.toString(16).padStart(4, '0')}  unused: ${fmt(4096 - d.payloadBytes)} bytes free`; return; }
    const row = i - (i % 8);
    hex.innerHTML = `0x${row.toString(16).padStart(4, '0')}  ` + Array.from({ length: 8 }, (_, k) => row + k < d.payloadBytes ? (row + k === i ? `<b>${hexAt(d, row + k)}</b>` : hexAt(d, row + k)) : '··').join(' ');
  });
  el.addEventListener('click', () => open(d));
  el.addEventListener('keydown', e => { if (e.key === 'Enter') open(d); });
  return el;
}
function render(sort) {
  const sorted = [...DEMOS].sort(sort === 'name' ? (a, b) => a.title.localeCompare(b.title) || a.subtitle.localeCompare(b.subtitle)
    : sort === 'asc' ? (a, b) => a.payloadBytes - b.payloadBytes : (a, b) => b.payloadBytes - a.payloadBytes);
  plates.replaceChildren(...sorted.map(plate));
  plates.insertAdjacentHTML('beforeend', `<article class="plate empty"><div class="num"><strong>0</strong><span>/ 4,096 B</span></div><div class="fill"></div>
    <div class="pair"><div class="shot">pilot · 12 tasks</div><div class="bytes"></div></div>
    <h3>Next plate<small>awaiting agent runs</small></h3><div class="meta"><span>effects · compositions · repairs · optimizations</span></div></article>`);
}
$('.sort').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('.sort button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render(b.dataset.sort);
});
render('desc');

/* detail sheet */
function open(d) {
  const dlg = $('#detail');
  const dump = [];
  for (let o = 0; o < Math.min(d.payloadBytes, 256); o += 16)
    dump.push(`${o.toString(16).padStart(4, '0')}  ${Array.from({ length: 16 }, (_, k) => o + k < d.payloadBytes ? hexAt(d, o + k) : '  ').join(' ')}`);
  dlg.innerHTML = `<div class="sheet"><button class="close" type="button" aria-label="Close">×</button>
    <div><div class="pair"><img class="shot" src="previews/${d.gif}" alt="${d.title}, animated capture"><img class="bytes" src="previews/${d.bytes}" alt="Payload bytes"></div>
      <div class="dump">${dump.join('\n')}${d.payloadBytes > 256 ? `\n…  ${fmt(d.payloadBytes - 256)} more bytes` : ''}</div></div>
    <div><h2>${d.title}</h2><div class="sub">${d.subtitle}${d.author ? ` · by ${d.author}` : ''}</div>
      <p>${d.description ?? d.notes[0] ?? ''}</p>
      <dl><dt>payload</dt><dd>${fmt(d.payloadBytes)} B · ${fmt(4096 - d.payloadBytes)} B free</dd><dt>profile</dt><dd>${d.profile} · ${d.engines.join(' + ')}</dd>
        <dt>video</dt><dd>160×120 ${d.format}</dd><dt>source</dt><dd>${d.source} · ${d.lines} lines</dd>
        ${d.scenes ? `<dt>scenes</dt><dd>${d.scenes.map(s => `${s.at}s ${s.name}`).join('<br>')}</dd>` : ''}
        <dt>cartridge</dt><dd>${d.cartridgeSha256}</dd></dl>
      <p><a href="https://demobench.janekm.com/" target="_blank" rel="noopener">Run in the viewer ↗</a></p></div></div>`;
  dlg.querySelector('.close').addEventListener('click', () => dlg.close());
  dlg.showModal();
}
$('#detail').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
</script>
<script src="switcher.js"></script>
</body>
</html>
