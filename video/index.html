<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #151619;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #151619;
      }
      #flash {
        position: absolute;
        inset: 0;
        z-index: 50;
        background: #fffaf2;
        opacity: 0;
        pointer-events: none;
      }
      #fade {
        position: absolute;
        inset: 0;
        z-index: 60;
        background: #0c0d0f;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- 60 s, cut to Daybreak's own soundtrack: 128 BPM, 4-bar sections of 7.5 s. -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div id="s00" class="clip" data-composition-id="s00" data-composition-src="compositions/s00-title.html" data-start="0" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s01" class="clip" data-composition-id="s01" data-composition-src="compositions/s01-pelican.html" data-start="7.5" data-duration="3.75" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s02" class="clip" data-composition-id="s02" data-composition-src="compositions/s02-carpet.html" data-start="11.25" data-duration="3.75" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s03" class="clip" data-composition-id="s03" data-composition-src="compositions/s03-limit.html" data-start="15" data-duration="3.75" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s04" class="clip" data-composition-id="s04" data-composition-src="compositions/s04-daybreak.html" data-start="18.75" data-duration="3.75" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s05" class="clip" data-composition-id="s05" data-composition-src="compositions/s05-machine.html" data-start="22.5" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s06" class="clip" data-composition-id="s06" data-composition-src="compositions/s06-limits.html" data-start="30" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s07" class="clip" data-composition-id="s07" data-composition-src="compositions/s07-creative.html" data-start="37.5" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s08" class="clip" data-composition-id="s08" data-composition-src="compositions/s08-sound.html" data-start="45" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="s09" class="clip" data-composition-id="s09" data-composition-src="compositions/s09-end.html" data-start="52.5" data-duration="7.5" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div id="flash"></div>
      <div id="fade"></div>

      <audio id="music" data-start="0" data-duration="60" data-track-index="0" src="assets/audio/daybreak.wav" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // A short white flash on every cut, like the demos' own scene changes. Full-section cuts
      // (the music's crash) flash harder than the mid-section cuts between demos.
      const cuts = [
        [7.5, 0.85], [11.25, 0.55], [15, 0.85], [18.75, 0.55],
        [22.5, 0.7], [30, 0.45], [37.5, 0.8], [45, 0.6], [52.5, 0.6],
      ];
      for (const [t, peak] of cuts) {
        tl.fromTo("#flash", { opacity: peak }, { opacity: 0, duration: 0.42, ease: "expo.out", immediateRender: false }, t);
      }
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.in", immediateRender: false }, 58.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
