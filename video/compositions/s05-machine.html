            const f = Math.min(449, Math.max(0, Math.floor(t * 60)));
            if (scope.length < (f + 1) * 128) return;
            ctx.strokeStyle = "#8b6cf0"; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.beginPath();
            for (let k = 0; k < 128; k++) {
              const v = ((scope[f * 128 + k] ^ 128) - 128) / 128;
              const x = (k / 127) * 424, y = 59 - Math.tanh(v * 2.2) * 50;
              k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke();
          };

          const tl = gsap.timeline({ paused: true });
          // One clock drives everything that ticks: program counters, GPU lanes, the scope.
          const clock = { t: 0 };
          const tick = () => {
            const t = clock.t;
            const cpuStep = Math.max(0, Math.floor((t - 1.4) / (beat / 2)));
            gsap.set(cpuList, { y: -((cpuStep % CPU.length) * 28) });
            const gpuStep = Math.max(0, Math.floor((t - 1.9) / (beat / 4)));
            gsap.set(gpuList, { y: -((gpuStep % GPU.length) * 28) });
            const w = Math.floor(t * 16);
            for (let i = 0; i < 64; i++) {
              const x = i % 8, y = (i / 8) | 0;
              lanes[i].style.background = t > 1.9 && ((x + y + w) % 8) < 3 ? "#2aa39d" : "#2c2d33";
            }
            drawScope(t);
          };
          tl.fromTo(clock, { t: 0 }, { t: 7.5, duration: 7.5, ease: "none", onUpdate: tick }, 0);

          tl.fromTo(R + "#s05-gridbg", { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.out" }, 0);
          tl.fromTo(R + "#s05-kicker", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.08);
          tl.fromTo(R + "#s05-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.16);
          tl.fromTo(R + "#s05-sub", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "sine.out" }, 0.5);

          // The machine assembles on the beat: bus, then one chip per beat.
          tl.fromTo(R + "#s05-bus", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, beat);
          tl.fromTo(R + "#s05-buslbl", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, beat + 0.8);
          const chips = [["#s05-rom", null], ["#s05-cpu", "#s05-w-cpu"], ["#s05-gpu", "#s05-w-gpu"], ["#s05-spu", "#s05-w-spu"],
            ["#s05-ram", "#s05-w-ram"], ["#s05-vid", "#s05-w-vid"]];
          chips.forEach(([box, wire], i) => {
            const t = beat * (2 + i);
            tl.fromTo(R + box, { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, t);
            tl.fromTo(R + box + " > *", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.06 }, t + 0.12);
            if (wire) tl.fromTo(R + wire, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, t - 0.1);
          });
          ["#s05-segA", "#s05-segB", "#s05-segR"].forEach((s, i) => {
            tl.fromTo(R + s, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.out" }, beat * 6 + 0.25 + i * 0.16);
          });

          // Data packets ride the wires: boot from ROM, then dispatch → render → scanout, and audio.
          const BUS = 610;
          const P = { rom: [372, BUS], cpu: [620, 532], gpu: [1090, 532], spu: [1614, 532], ram: [890, 690], vid: [1614, 690] };
          const busX = { rom: 372, cpu: 620, gpu: 1090, spu: 1614, ram: 890, vid: 1614 };
          const route = (a, b) => [P[a], [busX[a], BUS], [busX[b], BUS], P[b]];
          const trips = [["rom", "cpu", beat * 3.2], ["cpu", "gpu", beat * 4.3], ["gpu", "ram", beat * 6.5],
            ["rom", "cpu", beat * 8], ["cpu", "gpu", beat * 9], ["gpu", "ram", beat * 10], ["ram", "vid", beat * 11], ["spu", "ram", beat * 11.5],
            ["cpu", "gpu", beat * 13], ["gpu", "ram", beat * 14], ["ram", "vid", beat * 15]];
          trips.forEach(([a, b, t0], i) => {
            const el = R + "#s05-pk" + i;
            const pts = route(a, b);
            let t = t0;
            tl.set(el, { x: pts[0][0], y: pts[0][1], opacity: 1 }, t);
            for (let k = 1; k < pts.length; k++) {
              const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
              if (d < 1) continue;
              const dur = d / 2200;
              tl.fromTo(el, { x: pts[k - 1][0], y: pts[k - 1][1] }, { x: pts[k][0], y: pts[k][1], duration: dur, ease: "none", immediateRender: false }, t);
              t += dur;
            }
            tl.set(el, { opacity: 0 }, t);
          });
          window.__timelines["s05"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
