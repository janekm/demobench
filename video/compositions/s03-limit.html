<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; font-display: block; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
        @font-face { font-family: "Red Hat Mono"; src: url("assets/fonts/redhatmono.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #s03-root { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; color: #efeee9; font-family: "Figtree", sans-serif; }
        #s03-root .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; will-change: transform; }
        #s03-root .cam video { display: block; width: 1920px; height: 1080px; }
        #s03-root .chip { position: absolute; top: 56px; display: flex; align-items: center; gap: 18px; height: 52px; padding: 0 20px; background: #151619; font-family: "Red Hat Mono", monospace; font-size: 20px; letter-spacing: 0.08em; color: #a3a19a; text-transform: uppercase; }
        #s03-root .bug { left: 72px; font-family: "Unbounded", sans-serif; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; text-transform: none; color: #efeee9; }
        #s03-root .bug em { font-style: normal; color: #ff5a36; }
        #s03-root .hud { right: 72px; font-variant-numeric: tabular-nums; }
        #s03-root .hud b { color: #efeee9; font-weight: 500; }
        #s03-root .dots { display: flex; gap: 6px; }
        #s03-root .dots i { display: block; width: 14px; height: 14px; background: #3a3b41; }
        #s03-root .dots i.on { background: #ff5a36; }
        #s03-root .dots i.done { background: #efeee9; }
        #s03-root .panel { position: absolute; left: 72px; bottom: 72px; width: 780px; padding: 34px 42px 36px; background: #151619; display: flex; flex-direction: column; gap: 16px; }
        #s03-root .arule { position: absolute; left: 0; top: 0; width: 100%; height: 5px; background: #ff5a36; transform-origin: 0 50%; }
        #s03-root .meta { display: flex; gap: 14px; font-family: "Red Hat Mono", monospace; font-size: 22px; letter-spacing: 0.08em; color: #a3a19a; text-transform: uppercase; }
        #s03-root .meta .idx { color: #ff5a36; font-weight: 500; }
        #s03-root .meta .file { margin-left: auto; color: #efeee9; }
        #s03-root .name { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 104px; line-height: 1.02; letter-spacing: -0.045em; overflow: hidden; display: flex; padding-bottom: 6px; }
        #s03-root .name .ch { display: inline-block; }
        #s03-root .desc { font-size: 32px; line-height: 1.3; font-weight: 500; color: #efeee9; max-width: 690px; }
        #s03-root .gauge { display: flex; gap: 3px; margin-top: 6px; }
        #s03-root .gauge i { display: block; width: 18px; height: 16px; background: #ff5a36; }
        #s03-root .bytes { display: flex; gap: 12px; align-items: baseline; font-family: "Red Hat Mono", monospace; font-size: 22px; letter-spacing: 0.04em; color: #a3a19a; font-variant-numeric: tabular-nums; }
        #s03-root .bytes b { color: #efeee9; font-weight: 500; }
        #s03-root .bytes .free { margin-left: auto; color: #ff5a36; }
      </style>

      <div id="s03-root" data-composition-id="s03" data-width="1920" data-height="1080">
        <div class="cam" id="s03-cam" data-layout-allow-overflow>
          <video id="s03-video" data-start="0" data-duration="3.75" data-track-index="0" src="assets/footage/hero-limit.mp4" muted playsinline></video>
        </div>
        <div class="chip bug" id="s03-bug">Demo<em>/</em>Bench</div>
        <div class="chip hud" id="s03-hud"><span>Frame <b id="s03-frame">0000</b></span><span class="dots"><i class="done"></i><i class="done"></i><i class="on"></i><i></i></span></div>
        <div class="panel" id="s03-panel">
          <div class="arule" id="s03-arule"></div>
          <div class="meta" id="s03-meta"><span class="idx">03</span><span>/ 04</span><span class="file">limit.asm</span></div>
          <h2 class="name" id="s03-name"><span class="ch">L</span><span class="ch">i</span><span class="ch">m</span><span class="ch">i</span><span class="ch">t</span><span class="ch sp">&nbsp;</span><span class="ch">S</span><span class="ch">e</span><span class="ch">t</span></h2>
          <p class="desc" id="s03-desc">A flight through hyperbolic space that breaks apart into a fractal.</p>
          <div class="gauge" id="s03-gauge"></div>
          <div class="bytes"><span><b id="s03-count">0</b> / 4,096 bytes</span><span class="free">22 bytes free</span></div>
        </div>
      </div>

      <script>
        (() => {
          const R = "#s03-root ";
          const SRC_FRAME = 2700; // first frame of this shot in the cartridge's own timeline
          const BYTES = 4074;
          const gauge = document.querySelector(R + "#s03-gauge");
          for (let i = 0; i < 32; i++) gauge.appendChild(document.createElement("i"));
          const frame = document.querySelector(R + "#s03-frame");
          const count = document.querySelector(R + "#s03-count");
          const tl = gsap.timeline({ paused: true });
          // the picture is exactly 16:9 at 12x; the flight itself is the motion
                    const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: 3.75, duration: 3.75, ease: "none", onUpdate: () => {
            frame.textContent = String(SRC_FRAME + Math.floor(clock.t * 60)).padStart(4, "0");
          } }, 0);
          tl.fromTo(R + "#s03-panel", { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power4.out" }, 0.06);
          tl.fromTo(R + "#s03-arule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, 0.14);
          tl.fromTo(R + "#s03-meta span", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0.2);
          tl.fromTo(R + "#s03-name .ch", { yPercent: -110 }, { yPercent: 0, duration: 0.6, ease: "expo.out", stagger: { each: 0.035, from: "center" } }, 0.24);
          tl.fromTo(R + "#s03-desc", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.5);
          tl.fromTo(R + "#s03-gauge i", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power1.out", stagger: 0.012 }, 0.62);
          const n = { v: 0 };
          tl.fromTo(n, { v: 0 }, { v: BYTES, duration: 0.8, ease: "power2.out", immediateRender: false, onUpdate: () => {
            count.textContent = Math.round(n.v).toLocaleString("en-US");
          } }, 0.62);
          tl.fromTo([R + "#s03-bug", R + "#s03-hud"], { y: -16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "sine.out", stagger: 0.08 }, 0.3);
          window.__timelines["s03"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
