<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; font-display: block; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
        @font-face { font-family: "Red Hat Mono"; src: url("assets/fonts/redhatmono.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #s09-root { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; color: #efeee9; font-family: "Figtree", sans-serif; }
        #s09-root .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1440px; will-change: transform; }
        #s09-root .bg video { display: block; width: 1920px; height: 1440px; }
        #s09-root .dim { position: absolute; inset: 0; background: radial-gradient(ellipse 110% 80% at 28% 78%, rgba(21, 22, 25, 0.96) 0%, rgba(21, 22, 25, 0.88) 45%, rgba(21, 22, 25, 0.35) 100%); }
        #s09-root .content { position: absolute; left: 120px; right: 120px; bottom: 96px; display: flex; flex-direction: column; gap: 30px; }
        #s09-root .logo { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 168px; line-height: 1; letter-spacing: -0.045em; overflow: hidden; display: flex; padding-bottom: 10px; }
        #s09-root .logo .ch { display: inline-block; }
        #s09-root .logo .sl { color: #ff5a36; }
        #s09-root .url { display: flex; align-items: center; gap: 24px; font-size: 52px; font-weight: 600; letter-spacing: -0.01em; }
        #s09-root .url i { display: block; width: 26px; height: 26px; background: #ff5a36; }
        #s09-root .line { font-size: 34px; line-height: 1.3; color: #efeee9; max-width: 1100px; }
        #s09-root .rule { height: 2px; background: #4a4b52; transform-origin: 0 50%; }
        #s09-root .credits { display: flex; justify-content: space-between; font-family: "Red Hat Mono", monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a19a; }
        #s09-root .credits b { color: #efeee9; font-weight: 500; }
      </style>

      <div id="s09-root" data-composition-id="s09" data-width="1920" data-height="1080">
        <div class="bg" id="s09-bg" data-layout-allow-overflow>
          <video id="s09-video" data-start="0" data-duration="7.5" data-track-index="0" src="assets/footage/end-daylight.mp4" muted playsinline></video>
        </div>
        <div class="dim"></div>
        <div class="content">
          <h1 class="logo" id="s09-logo"><span class="ch">D</span><span class="ch">e</span><span class="ch">m</span><span class="ch">o</span><span class="ch sl">/</span><span class="ch">B</span><span class="ch">e</span><span class="ch">n</span><span class="ch">c</span><span class="ch">h</span></h1>
          <div class="url" id="s09-url"><i></i><span>demobench.janekm.com</span></div>
          <div class="line" id="s09-line">Run the cartridges live, with sound, in your browser.</div>
          <div class="rule" id="s09-rule"></div>
          <div class="credits" id="s09-credits"><span>Demos written by <b>Claude Opus</b></span><span>Music: <b>Daybreak</b>, 1,580 bytes of synth and song</span></div>
        </div>
      </div>

      <script>
        (() => {
          const R = "#s09-root ";
          const tl = gsap.timeline({ paused: true });
          // Daybreak's last scene (daylight, "BY OPUS"), in sync with the outro
          tl.fromTo(R + ".bg", { y: 0 }, { y: -60, duration: 7.5, ease: "sine.inOut", snap: { y: 1 } }, 0);
          tl.fromTo(R + ".logo .ch", { yPercent: 110 }, { yPercent: 0, duration: 0.9, ease: "expo.out", stagger: 0.04 }, 0.2);
          tl.fromTo(R + "#s09-url", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.8);
          tl.fromTo(R + "#s09-url i", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, 0.9);
          tl.fromTo(R + "#s09-line", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "sine.out" }, 1.25);
          tl.fromTo(R + "#s09-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.0, ease: "power4.inOut" }, 1.5);
          tl.fromTo(R + "#s09-credits span", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.12 }, 1.9);
          window.__timelines["s09"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
