<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; font-display: block; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
        @font-face { font-family: "Red Hat Mono"; src: url("assets/fonts/redhatmono.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #s07-root { position: absolute; inset: 0; overflow: hidden; background: #151619; color: #efeee9; font-family: "Figtree", sans-serif; }
        #s07-root .top { position: absolute; left: 0; top: 0; width: 1920px; height: 360px; display: flex; align-items: flex-end; justify-content: space-between; gap: 80px; padding: 0 72px 52px; }
        #s07-root .l { flex: none; display: flex; flex-direction: column; gap: 14px; }
        #s07-root .kicker { font-family: "Red Hat Mono", monospace; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a19a; }
        #s07-root .kicker b { color: #ff5a36; font-weight: 500; }
        #s07-root .mask { overflow: hidden; padding-bottom: 6px; }
        #s07-root .h { font-family: "Unbounded", sans-serif; font-weight: 800; word-spacing: 0.12em; font-size: 108px; line-height: 1; letter-spacing: -0.05em; white-space: nowrap; }
        #s07-root .body { font-size: 36px; line-height: 1.3; max-width: 720px; padding-bottom: 8px; }
        #s07-root .wall { position: absolute; left: 0; top: 360px; width: 1920px; height: 720px; }
        #s07-root .wall video { display: block; width: 1920px; height: 720px; }
        #s07-root .cover { position: absolute; width: 480px; height: 360px; background: #151619; transform-origin: 50% 0; }
        #s07-root .sep { position: absolute; background: #151619; }
        #s07-root .tag { position: absolute; padding: 6px 12px; background: #151619; font-family: "Red Hat Mono", monospace; font-size: 20px; letter-spacing: 0.06em; text-transform: uppercase; color: #efeee9; }
      </style>

      <div id="s07-root" data-composition-id="s07" data-width="1920" data-height="1080">
        <div class="top">
          <div class="l">
            <div class="kicker" id="s07-kicker"><b>3 / 4</b> · Room to be creative</div>
            <div class="mask"><div class="h" id="s07-h">No answer key</div></div>
          </div>
          <div class="body" id="s07-body">The brief is just “make a demo”. What it shows, and how it looks and sounds, is up to the agent.</div>
        </div>
        <div class="wall">
          <video id="s07-video" data-start="0" data-duration="7.5" data-track-index="0" src="assets/footage/wall.mp4" muted playsinline></video>
        </div>
        <div id="s07-overlay"></div>
      </div>

      <script>
        (() => {
          const R = "#s07-root ";
          const beat = 60 / 128;
          const TAGS = ["Pelican", "Carpet", "Limit Set", "Daybreak", "Megamix · vector balls", "Megamix · Boing", "Megamix · plasma", "Supersaw"];
          const ORDER = [0, 5, 2, 7, 4, 1, 6, 3]; // reveal order, alternating rows
          const ov = document.querySelector(R + "#s07-overlay");
          const covers = [], tags = [];
          TAGS.forEach((name, i) => {
            const x = (i % 4) * 480, y = 360 + ((i / 4) | 0) * 360;
            const tag = document.createElement("div");
            tag.className = "tag"; tag.textContent = name;
            tag.style.left = x + 16 + "px"; tag.style.top = y + 360 - 56 + "px";
            ov.appendChild(tag); tags.push(tag);
            const c = document.createElement("div");
            c.className = "cover"; c.style.left = x + "px"; c.style.top = y + "px";
            ov.appendChild(c); covers.push(c);
          });
          // hairline gutters between the tiles
          for (const [l, t, w, h] of [[478, 360, 4, 720], [958, 360, 4, 720], [1438, 360, 4, 720], [0, 718, 1920, 4]]) {
            const s = document.createElement("div");
            s.className = "sep"; Object.assign(s.style, { left: l + "px", top: t + "px", width: w + "px", height: h + "px" });
            ov.appendChild(s);
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(R + "#s07-kicker", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0.08);
          tl.fromTo(R + "#s07-h", { yPercent: 105 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 0.14);
          tl.fromTo(R + "#s07-body", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.6, ease: "sine.out" }, 0.45);
          // one tile per eighth note: the wall assembles across the first bar of the drop
          ORDER.forEach((i, k) => {
            const t = 0.05 + k * (beat / 2);
            tl.fromTo(covers[i], { scaleY: 1 }, { scaleY: 0, duration: 0.32, ease: "power4.inOut" }, t);
            tl.fromTo(tags[i], { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, t + 0.22);
          });
          window.__timelines["s07"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
