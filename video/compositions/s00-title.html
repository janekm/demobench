<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Unbounded"; src: url("assets/fonts/unbounded.woff2") format("woff2"); font-weight: 200 900; font-display: block; }
        @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree.woff2") format("woff2"); font-weight: 300 900; font-display: block; }
        @font-face { font-family: "Red Hat Mono"; src: url("assets/fonts/redhatmono.woff2") format("woff2"); font-weight: 300 700; font-display: block; }
        #s00-root { position: absolute; inset: 0; overflow: hidden; background: #0c0d0f; color: #efeee9; font-family: "Figtree", sans-serif; }
        #s00-root .bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1440px; will-change: transform; }
        #s00-root .bg video { display: block; width: 1920px; height: 1440px; }
        #s00-root .dim { position: absolute; inset: 0; background: radial-gradient(ellipse 120% 90% at 30% 55%, rgba(12, 13, 15, 0.7) 0%, rgba(12, 13, 15, 0.86) 70%, rgba(12, 13, 15, 0.94) 100%); }
        #s00-root .content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 84px 120px 88px; }
        #s00-root .row { display: flex; justify-content: space-between; align-items: center; font-family: "Red Hat Mono", monospace; font-size: 22px; letter-spacing: 0.08em; color: #a3a19a; text-transform: uppercase; }
        #s00-root .row b { color: #efeee9; font-weight: 500; }
        #s00-root .rule { height: 2px; background: #3a3b41; transform-origin: 0 50%; }
        #s00-root .top { display: flex; flex-direction: column; gap: 22px; }
        #s00-root .bottom { display: flex; flex-direction: column; gap: 22px; }
        #s00-root .mid { display: flex; flex-direction: column; gap: 40px; }
        #s00-root .logo { font-family: "Unbounded", sans-serif; font-weight: 800; font-size: 196px; line-height: 1; letter-spacing: -0.045em; display: flex; overflow: hidden; padding-bottom: 12px; }
        #s00-root .logo .ch { display: inline-block; }
        #s00-root .logo .sl { color: #ff5a36; }
        #s00-root .tag { font-size: 46px; font-weight: 500; line-height: 1.25; max-width: 1320px; }
        #s00-root .tag span { display: block; }
        #s00-root .cursor { display: inline-block; width: 22px; height: 44px; margin-left: 14px; vertical-align: -6px; background: #ff5a36; }
      </style>

      <div id="s00-root" data-composition-id="s00" data-width="1920" data-height="1080">
        <div class="bg" id="s00-bg" data-layout-allow-overflow>
          <video id="s00-video" data-start="0" data-duration="7.5" data-track-index="0" src="assets/footage/title-night.mp4" muted playsinline></video>
        </div>
        <div class="dim"></div>
        <div class="content">
          <div class="top">
            <div class="row" id="s00-toprow"><span><b>DB32</b> · a fantasy computer</span><span>Cartridges of <b>4,096 bytes</b></span></div>
            <div class="rule" id="s00-rule1"></div>
          </div>
          <div class="mid">
            <h1 class="logo" id="s00-logo"><span class="ch">D</span><span class="ch">e</span><span class="ch">m</span><span class="ch">o</span><span class="ch sl">/</span><span class="ch">B</span><span class="ch">e</span><span class="ch">n</span><span class="ch">c</span><span class="ch">h</span></h1>
            <div class="tag" id="s00-tag"><span>Tiny audiovisual demos, written by AI agents for a computer they’ve never seen.<i class="cursor" id="s00-cursor"></i></span></div>
          </div>
          <div class="bottom">
            <div class="rule" id="s00-rule2"></div>
            <div class="row" id="s00-botrow"><span>A benchmark for AI agents</span><span>160×120 pixels · 48 kHz stereo</span></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          const R = "#s00-root ";
          const beat = 60 / 128;
          const tl = gsap.timeline({ paused: true });
          // ambient: a slow drift over the night-time checkerboard (Daybreak's opening, in sync with the music)
          tl.fromTo(R + ".bg", { y: -430, scale: 1.1 }, { y: -468, scale: 1.14, duration: 7.5, ease: "none" }, 0);
          tl.fromTo([R + "#s00-rule1", R + "#s00-rule2"], { scaleX: 0 }, { scaleX: 1, duration: 1.3, ease: "power4.inOut", stagger: 0.1 }, 0.15);
          tl.fromTo(R + "#s00-toprow span", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out", stagger: 0.1 }, 0.35);
          tl.fromTo(R + ".logo .ch", { yPercent: 108 }, { yPercent: 0, duration: 1.05, ease: "expo.out", stagger: 0.05 }, 0.75);
          tl.fromTo(R + ".logo .sl", { rotation: -40, scale: 0.6 }, { rotation: 0, scale: 1, duration: 0.7, ease: "back.out(2)", immediateRender: false }, 1.0);
          tl.fromTo(R + "#s00-tag span", { x: -28, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: "sine.out" }, 2.1);
          tl.fromTo(R + "#s00-botrow span", { y: -14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out", stagger: 0.12 }, 2.5);
          // a cursor that blinks on the beat
          tl.set(R + "#s00-cursor", { opacity: 0 }, 0);
          for (let t = 3.0, on = true; t < 7.5; t += beat / 2, on = !on) tl.set(R + "#s00-cursor", { opacity: on ? 1 : 0 }, t);
          window.__timelines["s00"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
