          const scope = Uint8Array.from(atob(SCOPE_B64), (c) => c.charCodeAt(0));
          const ctx = $("#sb-scope").getContext("2d");
          const drawScope = (t) => {
            ctx.clearRect(0, 0, 280, 84);
            const f = Math.min(449, Math.max(0, Math.floor(t * 60)));
            if (scope.length < (f + 1) * 128) return;
            ctx.strokeStyle = "#f2f1ec"; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.beginPath();
            for (let k = 0; k < 128; k++) {
              const v = ((scope[f * 128 + k] ^ 128) - 128) / 128;
              const x = (k / 127) * 280, y = 42 - Math.tanh(v * 2.2) * 38;
              k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke();
          };

          const tl = gsap.timeline({ paused: true });
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: 7.5, duration: 7.5, ease: "none", onUpdate: () => {
            const t = clock.t, w = Math.floor(t * 16);
            for (let i = 0; i < 64; i++) {
              const x = i % 8, y = (i / 8) | 0;
              lanes[i].style.background = ((x + y + w) % 8) < 3 ? "#f2f1ec" : "#b52a0f";
            }
            drawScope(t);
          } }, 0);

          tl.fromTo(R + "#sb-num", { xPercent: -100 }, { xPercent: 0, duration: 0.4, ease: "expo.out" }, 0.02);
          tl.fromTo(R + "#sb-h span", { yPercent: 110 }, { yPercent: 0, duration: 0.32, ease: "expo.out", stagger: beat / 4 }, 0.06);

          // the machine assembles on the beat: bus, then one chip per beat
          tl.fromTo(R + "#sb-bus", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power4.out" }, beat * 2);
          ["#sb-rom", "#sb-cpu", "#sb-gpu", "#sb-spu", "#sb-vid"].forEach((b, i) => {
            tl.fromTo(R + b, { y: -140, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, beat * (3 + i));

          tl.fromTo(R + "#sb-drop", { scaleY: 0 }, { scaleY: 1, duration: 0.2, ease: "power4.out" }, beat * 8);

          tl.fromTo(R + "#sb-ramlbl", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, beat * 9);
          tl.fromTo(R + "#sb-ticker", { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "expo.out" }, beat * 9.5);

          // packets on the bus: boot, dispatch, render, scan-out, audio
          const X = { rom: 160, cpu: 480, gpu: 880, spu: 1280, vid: 1600, ram: 880 };
          const trips = [["rom", "cpu"], ["cpu", "gpu"], ["gpu", "ram"], ["ram", "vid"], ["spu", "ram"], ["cpu", "gpu"], ["gpu", "ram"]];

            const el = R + "#sb-pk" + i, t0 = beat * (10 + i);
            const pts = [[X[a], a === "ram" ? 728 : 592], [X[a], 609], [X[b], 609], [X[b], b === "ram" ? 728 : 592]];
            tl.set(el, { x: pts[0][0], y: pts[0][1], opacity: 1 }, t0);
            let t = t0;
            for (let k = 1; k < pts.length; k++) {
              const d = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]);
              if (d < 1) continue;
              const dur = d / 3000;
              tl.fromTo(el, { x: pts[k - 1][0], y: pts[k - 1][1] }, { x: pts[k][0], y: pts[k][1], duration: dur, ease: "none", immediateRender: false }, t);
              t += dur;
            }
            tl.set(el, { opacity: 0 }, t);
          });
          window.__timelines["sb"] = tl;
